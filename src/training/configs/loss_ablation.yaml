experiment:
  name: adv_translation
  seed: 42
  experiments_dir: src/training/experiments
  checkpoints_dir: src/training/checkpoints
data:
  root: outputs/preprocessed_expert/mha
  batch_size: 8
  num_workers: 4
  split_mode: fixed
  split_file: src/training/configs/resunet_baseline_split.json
  val_fraction: 0.2
  augment: true
  pad_multiple: 16
  augmentation:
    hflip_prob: 0.5
    vflip_prob: 0.1
    affine_prob: 0.8
    max_rotate_deg: 10.0
    max_translate_frac: 0.04
    min_scale: 0.95
    max_scale: 1.05
    elastic_prob: 0.15
    elastic_grid: 8
    elastic_magnitude: 3.0
    noise_prob: 0.15
    noise_std: 0.02
model:
  type: unetpp
  backbone: efficientnet-b4
  encoder_weights: imagenet
  encoder_depth: 5
  decoder_channels:
  - 256
  - 128
  - 64
  - 32
  - 16
  decoder_use_norm: batchnorm
  decoder_attention_type: null
  in_channels: 1
  out_channels: 1
  aux_segmentation:
    enabled: true
    out_channels: 1
    attention:
      enabled: true
      mode: decoder_final_gate
      strength: 1.0
      warmup_epochs: 20
module:
  type: adversarial_translation

adversarial:
  enabled: true
  weight: 0.005
  weight_ramp_epochs: 50
  discriminator_in_channels: 2
  discriminator_base_channels: 32
  discriminator_layers: 3
  discriminator_update_interval: 4
  discriminator_learning_rate: 0.00001
  discriminator_weight_decay:
loss:
  weights:
    l1: 1.0
    mse: 0.0
    roi_l1: 0.0
    ssim: 0.25
    roi_ssim: 0.5
    gradient: 0.0  # 0.5
    roi_gradient: 0.0
    perceptual: 0.3  # 0.03
    warmup_epochs: 0
    perceptual_clip_sigma: 5.0
    seg: 0.2
    kl: 0.02
    wavelet: 0.05
  kl:
    enabled: false
    histogram_bins: 16
    histogram_sigma: 0.15
    clip_sigma: 5.0
    min_roi_pixels: 8
    symmetric: true
    eps: 0.000001
  wavelet:
    enabled: true
    wavelet: haar
    min_roi_pixels: 4
    band_weights:
      ll: 1.0
      lh: 1.0
      hl: 1.0
      hh: 1.0
  seg:
    enabled: true
    modes:
    - frozen_segmenter
    - auxiliary_branch
    checkpoint: src/training/checkpoints/segmenter_unet_lite/version_3/03-091-0.85432.ckpt
    threshold: 0.5
    dice_weight: 0.5
    focal_weight: 0.0
    focal_alpha: 0.25
    focal_gamma: 2.0
    boundary_weight: 0.1
    model:
      type: tiny_unet
      in_channels: 1
      out_channels: 1
      base_channels: 16
      depth: 4
optimizer:
  type: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
trainer:
  max_epochs: 250
  accelerator: auto
  devices: auto
  precision: 16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_validation: true
  check_val_every_n_epoch: 1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 2
  fast_dev_run: false
  resume_checkpoint: null
evaluation:
  official_models_dir: src/evaluation/models
  official_eval_every_n_epochs: 0
logging:
  log_every_n_steps: 10
  rich_progress: true
  model_summary_depth: 2
  lr_logging_interval: epoch
  launch_tensorboard: true
  tensorboard_port: 1234
  visualize_val_samples: true
  num_visualization_cases: 4
checkpoint:
  filename: '{v_num:02d}-{epoch:03d}-{val_loss:.5f}'
  monitor: val_loss
  mode: min
  save_top_k: 1
early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience: 40
  min_delta: 0.0
